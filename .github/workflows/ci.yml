name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    tags:
      - "docker-*"
    paths:
      - "source/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: source

env:
  BUN_VERSION: latest
  PAYSTACK_API_BASE_URL: https://api.paystack.co
  PAYSTACK_CALLBACK_URL: ${{ format('{0}/checkout/confirm-order', vars.NEXT_PUBLIC_SERVER_URL) }}
  PAYSTACK_REFERENCE_PREFIX: wearjmk
  PAYSTACK_REQUEST_TIMEOUT_MS: '10000'

jobs:
  checks:
    name: Format and build
    if: ${{ !startsWith(github.ref, 'refs/tags/docker-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPANY_NAME: ${{ vars.COMPANY_NAME }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ vars.PAYLOAD_SECRET }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
      PREVIEW_SECRET: ${{ vars.PREVIEW_SECRET }}
      STRIPE_SECRET_KEY: ${{ vars.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOKS_SIGNING_SECRET: ${{ vars.STRIPE_WEBHOOKS_SIGNING_SECRET }}
      PAYSTACK_SECRET_KEY: ${{ vars.PAYSTACK_SECRET_KEY }}
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SHOWCASE_PRODUCTS_LIMITS: ${{ vars.NEXT_PUBLIC_SHOWCASE_PRODUCTS_LIMITS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('source/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: List available environment keys
        run: bun -e "Object.keys(process.env).sort().forEach((key) => console.log(key))"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --write --check .

      - name: Build
        run: bun run build

  docker:
    name: Build and push Docker image
    if: ${{ startsWith(github.ref, 'refs/tags/docker-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      COMPANY_NAME: ${{ vars.COMPANY_NAME }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ vars.PAYLOAD_SECRET }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
      PREVIEW_SECRET: ${{ vars.PREVIEW_SECRET }}
      STRIPE_SECRET_KEY: ${{ vars.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOKS_SIGNING_SECRET: ${{ vars.STRIPE_WEBHOOKS_SIGNING_SECRET }}
      PAYSTACK_SECRET_KEY: ${{ vars.PAYSTACK_SECRET_KEY }}
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SHOWCASE_PRODUCTS_LIMITS: ${{ vars.NEXT_PUBLIC_SHOWCASE_PRODUCTS_LIMITS }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      BUILDKIT_HOST: docker-container://buildkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start BuildKit
        run: docker run --rm --privileged -d --name buildkit moby/buildkit
        working-directory: .

      - name: Install Railpack
        run: curl -sSL https://railpack.com/install.sh | sh
        working-directory: .

      - name: Add Railpack to PATH
        run: echo "$HOME/.railpack/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Docker login
        run: echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin
        working-directory: .

      - name: Prepare image tags
        id: image
        run: |
          TAG="${GITHUB_REF_NAME#docker-}"
          IMAGE_REF="${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "versioned=${IMAGE_REF}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REF}:latest" >> "$GITHUB_OUTPUT"
          echo "cache=${IMAGE_REF}:buildcache" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Build with Railpack
        run: |
          railpack build \
            --name "${{ steps.image.outputs.versioned }}" \
            --cache-from "type=registry,ref=${{ steps.image.outputs.cache }}" \
            --cache-to "type=registry,ref=${{ steps.image.outputs.cache }},mode=max" \
            .

      - name: Tag image
        run: docker tag "${{ steps.image.outputs.versioned }}" "${{ steps.image.outputs.latest }}"
        working-directory: .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.versioned }}"
          docker push "${{ steps.image.outputs.latest }}"
        working-directory: .
